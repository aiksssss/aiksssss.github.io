<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AIKSSSSS</title>
<link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@100;200;300&family=Cormorant+Garamond:wght@200;300&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    background: linear-gradient(135deg, #f0ede8 0%, #e8e3db 25%, #ddd7cc 50%, #e4dfd7 75%, #ece8e2 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }

  /* Subtle texture overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse at 20% 50%, rgba(255,255,255,0.4) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 20%, rgba(200,190,176,0.3) 0%, transparent 50%),
      radial-gradient(ellipse at 60% 80%, rgba(180,170,158,0.2) 0%, transparent 50%);
    pointer-events: none;
  }

  /* Nav */
  nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 32px 52px;
    z-index: 10;
  }

  .nav-logo {
    font-family: 'Josefin Sans', sans-serif;
    font-weight: 100;
    font-size: 13px;
    letter-spacing: 0.45em;
    color: #9a9088;
    text-transform: uppercase;
  }

  .nav-menu {
    display: flex;
    flex-direction: column;
    gap: 5px;
    cursor: pointer;
  }

  .nav-menu span {
    display: block;
    width: 24px;
    height: 1px;
    background: #9a9088;
  }

  /* Main name */
  .main {
    position: relative;
    z-index: 2;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
  }

  .name {
    font-family: 'Josefin Sans', sans-serif;
    font-weight: 100;
    font-size: clamp(52px, 12vw, 148px);
    letter-spacing: 0.38em;
    text-transform: uppercase;
    color: transparent;
    background: linear-gradient(
      180deg,
      #b8b0a4 0%,
      #9a9088 30%,
      #7a7068 60%,
      #c4bdb4 100%
    );
    -webkit-background-clip: text;
    background-clip: text;
    line-height: 1;
    opacity: 0;
    animation: revealName 1.8s cubic-bezier(0.16, 1, 0.3, 1) 0.3s forwards;
    user-select: none;
  }

  .tagline {
    font-family: 'Josefin Sans', sans-serif;
    font-weight: 100;
    font-size: clamp(8px, 1.2vw, 12px);
    letter-spacing: 0.55em;
    text-transform: uppercase;
    color: #b0a898;
    margin-top: 28px;
    opacity: 0;
    animation: revealName 1.2s ease 1.2s forwards;
  }

  /* Decorative lines */
  .line-left, .line-right {
    position: fixed;
    top: 50%;
    transform: translateY(-50%);
    width: 1px;
    background: linear-gradient(180deg, transparent, #c4bdb4 40%, #c4bdb4 60%, transparent);
    opacity: 0;
    animation: revealName 1.2s ease 1.4s forwards;
  }
  .line-left { left: 52px; height: 180px; }
  .line-right { right: 52px; height: 180px; }

  /* Bottom bar */
  .bottom {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    padding: 32px 52px;
    z-index: 10;
    opacity: 0;
    animation: revealName 1s ease 1.6s forwards;
  }

  .bottom-link {
    font-family: 'Josefin Sans', sans-serif;
    font-weight: 100;
    font-size: 10px;
    letter-spacing: 0.4em;
    text-transform: uppercase;
    color: #b0a898;
    text-decoration: none;
    transition: color 0.3s;
  }
  .bottom-link:hover { color: #7a7068; }

  .bottom-center {
    font-family: 'Josefin Sans', sans-serif;
    font-weight: 100;
    font-size: 9px;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: #c8c0b4;
  }

  /* Animations */
  @keyframes revealName {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Mobile */
  @media (max-width: 600px) {
    nav { padding: 24px 28px; }
    .line-left, .line-right { display: none; }
    .bottom { padding: 24px 28px; }
    .name { letter-spacing: 0.2em; }
  }
</style>
</head>
<body>

<nav>
  <div class="nav-logo">Portfolio</div>
  <div class="nav-menu">
    <span></span>
    <span></span>
  </div>
</nav>

<div class="line-left"></div>
<div class="line-right"></div>

<main class="main">
  <div class="name">AIKSSSSS</div>
  <div class="tagline">Visual · Creative · Design</div>
</main>

<div class="bottom">
  <a href="https://instagram.com/ai.ksssss" class="bottom-link" target="_blank">Instagram</a>
  <div class="bottom-center">© 2025</div>
  <a href="https://t.me/ai.ksssss" class="bottom-link" target="_blank">Telegram</a>
</div>

</body>
</html>
