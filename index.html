<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AIKSSSSS</title>
<link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@100;200;300&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    background: linear-gradient(160deg, #f0ede8 0%, #e4dfd7 40%, #ddd7cc 70%, #ece8e2 100%);
    font-family: "Josefin Sans", sans-serif;
    overflow-x: hidden;
    color: #7a7068;
  }
  body::before {
    content: "";
    position: fixed; inset: 0;
    background: radial-gradient(ellipse at 15% 50%, rgba(255,255,255,0.5) 0%, transparent 55%),
                radial-gradient(ellipse at 85% 20%, rgba(200,190,176,0.25) 0%, transparent 50%);
    pointer-events: none; z-index: 0;
  }
  nav {
    position: fixed; top: 0; left: 0; right: 0;
    display: flex; justify-content: space-between; align-items: center;
    padding: 30px 52px; z-index: 100;
  }
  .nav-logo { font-weight: 100; font-size: 12px; letter-spacing: 0.5em; color: #9a9088; text-transform: uppercase; }
  .nav-right { font-weight: 100; font-size: 10px; letter-spacing: 0.4em; color: #b0a898; text-transform: uppercase; }
  .hero {
    position: relative; z-index: 1;
    display: flex; flex-direction: column; align-items: center;
    padding-top: 110px; padding-bottom: 32px;
  }
  .name {
    font-weight: 100; font-size: clamp(36px, 9vw, 110px);
    letter-spacing: 0.42em; text-transform: uppercase;
    color: transparent;
    background: linear-gradient(180deg, #c0b8ae 0%, #8a8078 40%, #6a6058 70%, #b8b0a4 100%);
    -webkit-background-clip: text; background-clip: text;
    opacity: 0; animation: fadeUp 1.6s cubic-bezier(0.16,1,0.3,1) 0.2s forwards;
    user-select: none; text-align: center;
  }
  .tagline {
    font-weight: 100; font-size: clamp(8px, 1.1vw, 11px);
    letter-spacing: 0.5em; text-transform: uppercase; color: #8a8078;
    margin-top: 16px; opacity: 0; animation: fadeUp 1s ease 1s forwards;
  }
  .carousel-section {
    position: relative; z-index: 1;
    display: flex; flex-direction: column; align-items: center;
    padding: 16px 0 100px;
  }
  .carousel-label {
    font-weight: 100; font-size: 9px; letter-spacing: 0.5em;
    text-transform: uppercase; color: #8a8078; margin-bottom: 36px;
    opacity: 0; animation: fadeUp 1s ease 1.3s forwards;
  }
  .scene {
    width: 100%; height: 500px; perspective: 1100px;
    display: flex; align-items: center; justify-content: center;
    opacity: 0; animation: fadeUp 1s ease 1.5s forwards;
  }
  .carousel { width: 190px; height: 400px; position: relative; transform-style: preserve-3d; }
  .card {
    position: absolute; width: 190px; height: 400px;
    border-radius: 1px; overflow: hidden; cursor: pointer;
    transition: transform 0.7s cubic-bezier(0.25,0.46,0.45,0.94), opacity 0.7s ease, box-shadow 0.3s ease;
  }
  .card:hover { box-shadow: 0 20px 60px rgba(0,0,0,0.15); }
  .card img { width: 100%; height: 100%; object-fit: cover; object-position: top center; display: block; transition: transform 0.5s ease; }
  .card:hover img { transform: scale(1.04); }
  .controls {
    display: flex; align-items: center; gap: 48px; margin-top: 40px;
    opacity: 0; animation: fadeUp 1s ease 1.8s forwards;
  }
  .btn {
    width: 38px; height: 38px; border: 1px solid #c0b8ae; border-radius: 50%;
    background: transparent; cursor: pointer; display: flex; align-items: center;
    justify-content: center; transition: all 0.3s; color: #9a9088; font-size: 15px; font-family: inherit;
  }
  .btn:hover { border-color: #7a7068; background: rgba(122,112,104,0.08); color: #5a5048; }
  .counter { font-weight: 100; font-size: 10px; letter-spacing: 0.35em; color: #b0a898; min-width: 44px; text-align: center; }
  footer {
    position: fixed; bottom: 0; left: 0; right: 0;
    display: flex; justify-content: space-between; align-items: center;
    padding: 26px 52px; z-index: 100;
  }
  .footer-link { font-weight: 100; font-size: 10px; letter-spacing: 0.4em; text-transform: uppercase; color: #b0a898; text-decoration: none; transition: color 0.3s; }
  .footer-link:hover { color: #6a6058; }
  .footer-copy { font-weight: 100; font-size: 9px; letter-spacing: 0.3em; color: #c8c0b4; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
  @media (max-width: 600px) {
    nav, footer { padding: 20px 24px; }
    .name { letter-spacing: 0.18em; }
    .scene { height: 420px; }
    .carousel, .card { width: 160px; height: 340px; }
  }
</style>
</head>

<script>
  const carousel = document.getElementById("carousel");
  const cards = Array.from(carousel.querySelectorAll(".card"));
  const counter = document.getElementById("counter");
  const total = cards.length;
  const angleStep = 360 / total;
  const radius = 300;
  let current = 0;
  function update() {
    cards.forEach((card, i) => {
      const angle = ((i - current) * angleStep) * (Math.PI / 180);
      const x = Math.sin(angle) * radius;
      const z = Math.cos(angle) * radius - radius;
      const cosA = Math.cos(angle);
      const scale = 0.6 + 0.4 * ((cosA + 1) / 2);
      const opacity = 0.3 + 0.7 * ((cosA + 1) / 2);
      const zIndex = Math.round(100 * ((cosA + 1) / 2));
      card.style.transform = `translateX(${x}px) translateZ(${z}px) scale(${scale})`;
      card.style.opacity = opacity;
      card.style.zIndex = zIndex;
    });
    const idx = ((current % total) + total) % total;
    counter.textContent = `${idx + 1} / ${total}`;
  }
  document.getElementById("next").addEventListener("click", () => { current++; update(); });
  document.getElementById("prev").addEventListener("click", () => { current--; update(); });
  let startX = 0;
  carousel.addEventListener("touchstart", e => { startX = e.touches[0].clientX; });
  carousel.addEventListener("touchend", e => {
    const diff = startX - e.changedTouches[0].clientX;
    if (Math.abs(diff) > 40) { diff > 0 ? current++ : current--; update(); }
  });
  update();

  // Lightbox
  const lightbox = document.createElement('div');
  lightbox.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:999;display:none;align-items:center;justify-content:center;cursor:zoom-out;backdrop-filter:blur(8px);';
  const lbImg = document.createElement('img');
  lbImg.style.cssText = 'max-height:90vh;max-width:90vw;object-fit:contain;border-radius:2px;transform:scale(0.9);opacity:0;transition:transform 0.3s ease,opacity 0.3s ease;';
  lightbox.appendChild(lbImg);
  document.body.appendChild(lightbox);

  cards.forEach(card => {
    card.addEventListener('click', () => {
      const idx = ((current % total) + total) % total;
      const activeCard = cards[idx];
      if (card !== activeCard) return;
      lbImg.src = card.querySelector('img').src;
      lightbox.style.display = 'flex';
      setTimeout(() => { lbImg.style.transform = 'scale(1)'; lbImg.style.opacity = '1'; }, 10);
    });
  });

  lightbox.addEventListener('click', () => {
    lbImg.style.transform = 'scale(0.9)';
    lbImg.style.opacity = '0';
    setTimeout(() => { lightbox.style.display = 'none'; }, 300);
  });
</script>
